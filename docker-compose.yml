# Containerised run: mocks on :8081, API on :8080, at the fixture clock.
x-env: &env
  NOW: ${NOW:-2026-11-06T12:00:00Z}

services:
  mocks:
    build: .
    command: ['node_modules/.bin/tsx', 'mocks/server.ts']
    environment:
      <<: *env
    ports:
      - '8081:8081'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8081/__admin/faults').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    depends_on:
      mocks:
        condition: service_healthy
    environment:
      <<: *env
      DEV_ISSUER: 'true'
      MOCKS_URL: http://mocks:8081
      DB_PATH: /app/data/platform.db
    ports:
      - '8080:8080'
    volumes:
      - platform-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  platform-data:
